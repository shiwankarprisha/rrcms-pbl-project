name: RRCMS CI Validation Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend Lint, Build & Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rrcms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/rrcms_test
      SHADOW_DATABASE_URL: mysql://root:root@127.0.0.1:3306/rrcms_shadow

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Create Shadow Database
        run: |
          mysql -h 127.0.0.1 -uroot -proot \
            -e "CREATE DATABASE IF NOT EXISTS rrcms_shadow;"

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Prepare Test Database
        working-directory: backend
        run: npx prisma db push

      - name: Seed Test Database
        working-directory: backend
        run: npm run seed

      - name: Typecheck and Compile Backend
        working-directory: backend
        run: npm run build

      - name: Run Backend Test Suite
        working-directory: backend
        run: npm test

  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build
